# 每次 push 與 PR 自動跑：後端測試、migration 檢查，前端 lint 與 build（含型別檢查）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NCUACG
    env:
      # 只給 CI 用的假金鑰；本機與正式站請在 NCUACG/.env 設定自己的
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: NCUACG/requirements.txt
      - run: pip install -r requirements.txt
      - name: 檢查是否有忘記產生的 migration
        run: python manage.py makemigrations --check --dry-run
      - name: 後端測試
        run: python manage.py test accounts club event

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
